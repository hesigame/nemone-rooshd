<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی افعال عربی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17302a;--mute:#5d716b;--line:#cfdad5;--accent:#0f6b5a;--accent-ink:#fff;--ok:#1b7f4b;--okbg:#dff3e7;--bad:#b3261e;--badbg:#fbe3e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#17262a;--ink:#e6f1ed;--mute:#9bb3ab;--line:#2c4540;--accent:#4cc9a8;--accent-ink:#06231c;--ok:#6fdc9c;--okbg:#17382a;--bad:#ff8b82;--badbg:#3d1d1b}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#17262a;--ink:#e6f1ed;--mute:#9bb3ab;--line:#2c4540;--accent:#4cc9a8;--accent-ink:#06231c;--ok:#6fdc9c;--okbg:#17382a;--bad:#ff8b82;--badbg:#3d1d1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.7;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.9rem;margin:8px 0;font-weight:800}
.ar{font-family:"Vazirmatn","Traditional Arabic",Tahoma,serif;direction:rtl}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 24px;cursor:pointer}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mute{color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:0 12px;font-size:.85rem;margin-bottom:10px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 4px}
.verb{font-size:2.6rem;font-weight:800;color:var(--accent);margin:0 0 14px;text-align:center}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:1.6rem;font-weight:600;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:1.7em;margin:14px 0 0;font-weight:600}
.next{margin-top:12px;display:none}
.score{font-size:3rem;font-weight:800;color:var(--accent);margin:6px 0}
.hide{display:none}
.cw{position:relative}#cv{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;cursor:crosshair;margin-top:10px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:12px;padding:16px}.ov.hide{display:none}
</style>
</head>
<body>
<main>
<section id="start" class="card">
<h1>بازی افعال عربی</h1>
<p class="mute">۲۰ سؤال چهارگزینه‌ای از امر، ماضی و مضارع. هر بار ترتیب گزینه‌ها عوض می‌شود.</p>
<p><button class="btn" id="go">شروع بازی</button></p>
</section>

<section id="quiz" class="hide">
<div class="top"><span id="no"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card">
<span class="tag" id="cat"></span>
<p class="q" id="qt"></p>
<p class="verb ar" id="vb"></p>
<div class="opts ar" id="op"></div>
<p class="fb" id="fb" aria-live="polite"></p>
<button class="btn next" id="nx">سؤال بعدی</button>
</div>
</section>

<section id="end" class="card hide">
<h1>پایان سؤال‌ها</h1>
<div class="score" id="fs"></div>
<p id="msg" class="mute"></p>
<p id="zi" class="mute"></p><p><button class="btn" id="zb">شروع نبرد با زامبی‌ها</button></p>
</section>

<section id="zg" class="hide">
<div class="top"><span id="hb"></span><span id="hl"></span><span id="hk"></span></div>
<div class="cw"><canvas id="cv"></canvas>
<div class="ov hide" id="ov"><h1 id="om" style="font-size:1.4rem"></h1><p><button class="btn" id="again">بازی دوباره</button></p></div></div>
<p class="mute">گوشی: روی زامبی بزنید تا شلیک شود. کامپیوتر: ماوس را حرکت بدهید و کلیک کنید (یا کلید فاصله).</p>
</section>
</main>
<script>
// [فعل، متن سؤال، گزینهٔ درست، سه گزینهٔ غلط]
var A="امر",P="ماضی",M="مضارع";
var DATA=[
[A,"ذَهَبَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","اِذْهَبِي",["اِذْهَبْ","اِذْهَبُوا","اِذْهَبْنَ"]],
[A,"كَتَبَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","اُكْتُبِي",["اُكْتُبْ","اُكْتُبَا","اُكْتُبْنَ"]],
[A,"فَتَحَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","اِفْتَحِي",["اِفْتَحْ","اِفْتَحُوا","اِفْتَحَا"]],
[A,"جَلَسَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","اِجْلِسِي",["اِجْلِسْ","اِجْلِسُوا","اِجْلِسْنَ"]],
[A,"شَرِبَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","اِشْرَبِي",["اِشْرَبْ","اِشْرَبُوا","اِشْرَبَا"]],
[A,"أَكَلَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","كُلِي",["كُلْ","كُلُوا","كُلْنَ"]],
[A,"سَمِعَ","فعل امر مفرد مؤنث (مخاطبه) کدام است؟","اِسْمَعِي",["اِسْمَعْ","اِسْمَعُوا","اِسْمَعْنَ"]],
[P,"ذَهَبَ","ماضی مفرد مؤنث غایب (او – زن) کدام است؟","ذَهَبَتْ",["ذَهَبَ","ذَهَبْتَ","ذَهَبْنَا"]],
[P,"كَتَبَ","ماضی متکلم وحده (من) کدام است؟","كَتَبْتُ",["كَتَبْتَ","كَتَبْتِ","كَتَبْنَا"]],
[P,"فَتَحَ","ماضی مفرد مؤنث مخاطب (تو – زن) کدام است؟","فَتَحْتِ",["فَتَحْتَ","فَتَحَتْ","فَتَحْتُ"]],
[P,"شَرِبَ","ماضی جمع مذکر غایب (آنان – مردان) کدام است؟","شَرِبُوا",["شَرِبَا","شَرِبْتُمْ","شَرِبْنَا"]],
[P,"جَلَسَ","ماضی مثنی مذکر غایب (آن دو – مرد) کدام است؟","جَلَسَا",["جَلَسُوا","جَلَسَتَا","جَلَسْتُمَا"]],
[P,"سَمِعَ","ماضی متکلم مع الغیر (ما) کدام است؟","سَمِعْنَا",["سَمِعْتُمْ","سَمِعُوا","سَمِعْنَ"]],
[P,"أَكَلَ","ماضی جمع مؤنث غایب (آنان – زنان) کدام است؟","أَكَلْنَ",["أَكَلُوا","أَكَلَتْ","أَكَلْتُنَّ"]],
[M,"ذَهَبَ","مضارع مفرد مؤنث غایب (او – زن) کدام است؟","تَذْهَبُ",["يَذْهَبُ","أَذْهَبُ","نَذْهَبُ"]],
[M,"كَتَبَ","مضارع متکلم وحده (من) کدام است؟","أَكْتُبُ",["نَكْتُبُ","تَكْتُبُ","يَكْتُبُ"]],
[M,"فَتَحَ","مضارع مفرد مؤنث مخاطب (تو – زن) کدام است؟","تَفْتَحِينَ",["تَفْتَحُ","تَفْتَحُونَ","يَفْتَحُونَ"]],
[M,"شَرِبَ","مضارع جمع مذکر غایب (آنان – مردان) کدام است؟","يَشْرَبُونَ",["يَشْرَبَانِ","تَشْرَبُونَ","يَشْرَبْنَ"]],
[M,"جَلَسَ","مضارع مثنی مخاطب (شما دو نفر) کدام است؟","تَجْلِسَانِ",["يَجْلِسَانِ","تَجْلِسُونَ","تَجْلِسْنَ"]],
[M,"سَمِعَ","مضارع متکلم مع الغیر (ما) کدام است؟","نَسْمَعُ",["أَسْمَعُ","يَسْمَعُونَ","تَسْمَعْنَ"]]
];
var $=function(i){return document.getElementById(i)};
var cur=0,score=0,order=[];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","quiz","end","zg"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function render(){
  var d=DATA[cur];
  $("no").textContent="سؤال "+(cur+1)+" از "+DATA.length;
  $("sc").textContent="تیرها: "+score;
  $("pb").style.width=(cur/DATA.length*100)+"%";
  $("cat").textContent="فعل "+d[0];
  $("qt").textContent=d[2];
  $("vb").textContent=d[1];
  $("fb").textContent="";$("fb").style.color="";
  $("nx").style.display="none";
  $("nx").textContent=cur===DATA.length-1?"دیدن نتیجه":"سؤال بعدی";
  var box=$("op");box.innerHTML="";
  shuffle([d[3]].concat(d[4])).forEach(function(t){
    var b=document.createElement("button");
    b.className="opt";b.textContent=t;b.lang="ar";
    b.onclick=function(){pick(b,t===d[3])};
    box.appendChild(b);
  });
}
function pick(btn,right){
  var d=DATA[cur];
  Array.prototype.forEach.call($("op").children,function(b){
    b.disabled=true;
    if(b.textContent===d[3])b.classList.add("ok");
  });
  if(right){score++;$("fb").textContent="معلومه معلمت آقا حاجیونده!";$("fb").style.color="var(--ok)"}
  else{btn.classList.add("bad");$("fb").textContent="نادرست. پاسخ درست: "+d[3];$("fb").style.color="var(--bad)"}
  $("sc").textContent="تیرها: "+score;
  $("nx").style.display="inline-block";$("nx").focus();
}
function finish(){
  show("end");
  $("fs").textContent=score+" تیر";$("zi").textContent="از "+DATA.length+" سؤال "+score+" تا درست بود. هر پاسخ درست یک تیر است. ۱۵ زامبی با فاصلهٔ ۳ ثانیه به مدرسه حمله می‌کنند.";
  $("msg").textContent=score>=18?"عالی بود، افعال را خوب می‌شناسید.":score>=12?"خوب بود، کمی تمرین دیگر کافی است.":"ادامه بدهید، با تمرین بهتر می‌شود.";
}
$("go").onclick=$("again").onclick=function(){cur=0;score=0;show("quiz");render()};
$("nx").onclick=function(){cur++;cur<DATA.length?render():finish()};
var cv=$("cv"),cx=cv.getContext("2d"),W=640,H=400,Z={on:0,zs:[]};cv.width=W;cv.height=H;
function PL(c,p){cx.fillStyle=c;cx.beginPath();cx.moveTo(p[0],p[1]);for(var i=2;i<p.length;i+=2)cx.lineTo(p[i],p[i+1]);cx.fill()}
function bg(){var P=PL,a=W*.35,b=W*.65,c=H*.28,d=H*.46;
P("#d9d4c3",[0,0,W,0,b,c,a,c]);P("#8a7f6a",[0,H,a,d,b,d,W,H]);P("#c9c2a8",[a,c,b,c,b,d,a,d]);
P("#3d6f9e",[0,0,a,c,a,d,0,H]);P("#3d6f9e",[W,0,b,c,b,d,W,H]);
cx.lineWidth=2;cx.strokeStyle="#1d3a56";
for(var t=.2;t<1;t+=.2){var x=t*a,y1=t*c,y2=H-t*(H-d);cx.beginPath();cx.moveTo(x,y1);cx.lineTo(x,y2);cx.moveTo(W-x,y1);cx.lineTo(W-x,y2);cx.stroke()}
cx.strokeStyle="#6e6451";for(var k=1;k<4;k++){cx.beginPath();cx.moveTo(a+k*(b-a)/4,d);cx.lineTo(k*W/4,H);cx.stroke()}
cx.fillStyle="#5a3d2b";cx.fillRect(W*.46,c+22,W*.08,d-c-22);
cx.fillStyle="#2d5a3d";cx.fillRect(a+8,c+3,b-a-16,16);cx.fillStyle="#fff";cx.font="12px Vazirmatn,Tahoma";cx.textAlign="center";cx.fillText("مدرسه",W/2,c+15)}
function dz(z,t){var p=1-z.z,h=50+330*p*p,w=h*.5,sx=W/2+z.x*(40+p*W*.4),fy=H*.45+H*.6*p;z.sx=sx;z.fy=fy;z.h=h;z.w=w;
cx.save();cx.translate(sx+Math.sin(t*3+z.ph)*h*.03,fy);
cx.fillStyle="#3a3a55";cx.fillRect(-w*.3,-h*.4,w*.25,h*.4);cx.fillRect(w*.05,-h*.4,w*.25,h*.4);
cx.fillStyle="#6b3b3b";cx.fillRect(-w*.35,-h*.72,w*.7,h*.34);
cx.fillStyle="#6f9a5b";cx.fillRect(-w*.7,-h*.7,w*.35,h*.1);cx.fillRect(w*.35,-h*.7,w*.35,h*.1);cx.fillRect(-w*.22,-h,w*.44,h*.28);
cx.fillStyle="#d22";cx.fillRect(-w*.14,-h*.92,w*.08,h*.05);cx.fillRect(w*.06,-h*.92,w*.08,h*.05);
cx.fillStyle="#222";cx.fillRect(-w*.1,-h*.8,w*.2,h*.03);cx.restore()}
function gun(){var gx=W*.7,gy=H+5,an=Math.atan2(Z.ay-gy,Z.ax-gx);an=Math.max(-1.9,Math.min(-.8,an));
cx.save();cx.translate(gx,gy);cx.rotate(an);cx.translate(-Z.rec,0);
cx.fillStyle="#4a2e1a";cx.beginPath();cx.moveTo(10,8);cx.lineTo(45,8);cx.lineTo(32,70);cx.lineTo(0,70);cx.fill();
cx.fillStyle="#2b2b30";cx.fillRect(0,-4,95,14);cx.fillStyle="#b8bcc4";cx.fillRect(0,-22,125,20);cx.fillStyle="#8a8e96";cx.fillRect(118,-26,7,5);
if(Z.fl>0){cx.fillStyle="#ffd54a";cx.beginPath();cx.arc(135,-12,16,0,7);cx.fill()}cx.restore()}
function shoot(){if(!Z.on||Z.bul<1)return;Z.bul--;Z.fl=.08;Z.rec=18;var best=null;
Z.zs.forEach(function(z){if(Math.abs(Z.ax-z.sx)<z.w*.55&&Z.ay<z.fy&&Z.ay>z.fy-z.h&&(!best||z.z<best.z))best=z});
if(best){Z.zs.splice(Z.zs.indexOf(best),1);Z.kill++}}
function over(w){Z.on=0;$("ov").classList.remove("hide");
$("om").textContent=w?"همهٔ زامبی‌ها نابود شدند! آقا حاجیوند افتخار می‌کنه.":"زامبی‌ها پیروز شدند. شما "+Z.kill+" زامبی کشتید."}
function loop(n){if(!Z.on)return;var dt=Math.min((n-Z.last)/1000,.1);Z.last=n;Z.t+=dt;Z.sp+=dt;
if(Z.sp>=3&&Z.sn<15){Z.sp=0;Z.sn++;Z.zs.push({x:Math.random()*1.6-.8,z:1,ph:Math.random()*6})}
Z.zs.forEach(function(z){z.z-=dt/8});
Z.zs=Z.zs.filter(function(z){if(z.z<=.04){Z.life--;Z.hit=.25;return false}return true});
Z.fl-=dt;Z.hit-=dt;Z.rec*=.85;bg();
Z.zs.slice().sort(function(a,b){return b.z-a.z}).forEach(function(z){dz(z,Z.t)});
if(Z.hit>0){cx.fillStyle="rgba(200,0,0,.35)";cx.fillRect(0,0,W,H)}
gun();cx.strokeStyle="#f33";cx.lineWidth=2;cx.beginPath();cx.arc(Z.ax,Z.ay,14,0,7);cx.moveTo(Z.ax-20,Z.ay);cx.lineTo(Z.ax+20,Z.ay);cx.moveTo(Z.ax,Z.ay-20);cx.lineTo(Z.ax,Z.ay+20);cx.stroke();
$("hb").textContent="تیر: "+Z.bul;$("hl").textContent="جان: "+Z.life;$("hk").textContent="کشته: "+Z.kill+" از ۱۵";
if(Z.life<=0)return over(0);if(Z.sn>=15&&!Z.zs.length)return over(1);requestAnimationFrame(loop)}
function startZ(){Z={on:1,bul:score,life:3,sn:0,kill:0,zs:[],t:0,sp:3,ax:W/2,ay:H*.4,fl:0,rec:0,hit:0,last:performance.now()};show("zg");$("ov").classList.add("hide");requestAnimationFrame(loop)}
function pp(e){var r=cv.getBoundingClientRect();Z.ax=(e.clientX-r.left)*W/r.width;Z.ay=(e.clientY-r.top)*H/r.height}
cv.addEventListener("pointermove",pp);cv.addEventListener("pointerdown",function(e){e.preventDefault();pp(e);shoot()});
document.addEventListener("keydown",function(e){if(e.code==="Space"&&Z.on){e.preventDefault();shoot()}});
$("zb").onclick=startZ;
</script>
</body>
</html>
