<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f64e0">
<title>نمونه رشد</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">

<body>

<header class="topbar">
  <a class="brand" href="#/" aria-label="نمونه رشد، صفحه اصلی">

  <button class="theme-btn" id="themeBtn" type="button" aria-label="تغییر حالت روشن و تاریک">◐</button>
</header>

<main id="main">
  <nav class="crumbs" id="crumbs" aria-label="مسیر"></nav>
  <div id="view"></div>
</main>

<footer class="footer">
  <p>مدرسه نمونه رشد</p>
  <button class="maker" id="makerBtn" type="button" aria-haspopup="dialog">سازنده: امیرحسام خوشابی <span>(کلیک کنید)</span></button>
</footer>

<div class="modal" id="makerModal" role="dialog" aria-modal="true" aria-labelledby="makerTitle" hidden>

    <button class="modal-x" id="makerClose" type="button" aria-label="بستن">×</button>
    <div class="avatar" aria-hidden="true">ا</div>
    <h3 id="makerTitle">امیرحسام خوشابی</h3>
    <p class="meta">سازنده‌ی سایت</p>
    <ul class="ids">
      <li><span>آی‌دی روبیکا</span><b dir="ltr">@hesigame</b></li>
      <li><span>نام کاربری بله</span><b dir="ltr">@hesi_game</b></li>
      <li><span>آی‌دی شاد</span><b dir="ltr">@AmirHessamKhoshabi</b></li>
    </ul>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
